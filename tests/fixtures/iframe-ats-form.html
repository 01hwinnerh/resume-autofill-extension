<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><title>Iframe ATS 表单</title><style>body{margin:0;padding:18px;background:#f8faff;color:#172033;font:14px/1.5 system-ui,sans-serif}label{display:grid;gap:5px;margin:10px 0;font-weight:650}input,textarea{padding:9px;border:1px solid #b9c7da;border-radius:8px;font:inherit}</style></head>
<body><fieldset><legend>工作经历</legend><label>公司名称<input name="company" /></label><label>职位名称<input name="title" /></label><label>开始时间<input name="work_start" type="month" /></label><label>结束时间<input name="work_end" type="month" /></label><label>工作描述<textarea name="work_description"></textarea></label></fieldset></body>
</html>
