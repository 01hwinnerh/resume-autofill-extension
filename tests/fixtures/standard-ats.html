<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>标准 ATS 兼容性测试</title>
  <style>
    body { margin: 0; background: #f4f7fb; color: #172033; font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 36px auto; padding: 30px; background: white; border-radius: 18px; box-shadow: 0 16px 40px #163a6414; }
    h1 { margin-top: 0; } fieldset { margin: 22px 0; padding: 20px; border: 1px solid #dce5f2; border-radius: 12px; }
    label { display: grid; gap: 6px; margin: 14px 0; font-weight: 650; }
    input, textarea, select { padding: 10px 12px; border: 1px solid #b9c7da; border-radius: 8px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 9px; background: #246bfd; color: white; }
  </style>
</head>
<body>
  <main>
    <h1>标准 HTML ATS</h1>
    <p>用于验证 label、name、autocomplete、select、textarea 和安全提交边界。</p>
    <form id="application-form">
      <fieldset><legend>基本信息</legend>
        <label for="full-name">姓名<input id="full-name" name="full_name" autocomplete="name" /></label>
        <label for="email">电子邮箱<input id="email" name="email" type="email" autocomplete="email" /></label>
        <label for="phone">手机号码<input id="phone" name="phone" type="tel" autocomplete="tel" /></label>
        <label for="city">所在城市<select id="city" name="city"><option value="">请选择</option><option>北京</option><option>上海</option><option>深圳</option></select></label>
      </fieldset>
      <fieldset><legend>教育经历</legend>
        <label for="school">学校名称<input id="school" name="school" /></label>
        <label for="major">专业<input id="major" name="major" /></label>
        <label for="education-start">开始时间<input id="education-start" name="education_start" type="month" /></label>
        <label for="education-end">结束时间<input id="education-end" name="education_end" type="month" /></label>
      </fieldset>
      <label for="summary">自我评价<textarea id="summary" name="summary" rows="5"></textarea></label>
      <button id="submit-application" type="submit">提交申请</button>
      <output id="submit-state">尚未提交</output>
    </form>
  </main>
  <script>document.querySelector('form').addEventListener('submit', event => { event.preventDefault(); document.querySelector('#submit-state').textContent = '检测到手动提交'; });</script>
</body>
</html>
